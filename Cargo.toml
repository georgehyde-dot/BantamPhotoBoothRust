[package]
name = "rust_photobooth"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The core async runtime for Rust
tokio = { version = "1", features = ["full"] }

# The web framework
axum = "0.7"

# Middleware and utilities for serving static files
tower-http = { version = "0.5", features = ["fs", "trace"] }

# For robust error handling
thiserror = "1.0"

# For JSON serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For camera access via V4L2 (works on macOS webcams and Pi)
rscam = "0.5.5"

# For image processing and saving
image = "0.25"

# For defining async functions in traits
async-trait = "0.1"

rust-embed={"version" = "8.7.2", "features" = ["include-exclude"]}
axum-embed = "0.1.0"
# libcamera = "0.4.0"

axum-server = { version = "0.6", features = ["tls-rustls"] }
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"

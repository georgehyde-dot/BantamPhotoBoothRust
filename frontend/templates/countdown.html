<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Photo Countdown</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        
        .countdown-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .countdown-message {
            font-size: 24px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .camera-preview {
            width: 90%;
            max-width: 800px;
            height: 600px;
            background: #000;
            border: 3px solid #333;
            border-radius: 10px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #666;
            font-size: 18px;
            flex-direction: column;
        }
        
        .countdown-display {
            font-size: 80px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 10px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .start-countdown-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .start-countdown-btn:hover {
            background: #45a049;
        }
        
        .start-countdown-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
        
        .flash-overlay.flash {
            opacity: 0.9;
        }
        
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            font-size: 16px;
        }
        
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-size: 12px;
            border-radius: 5px;
            max-width: 300px;
        }
        
        /* Mobile optimizations */
        @media (max-width: 480px) {
            .countdown-container {
                padding: 5px;
            }
            
            .camera-preview {
                width: 95%;
                max-width: 480px;
                height: 360px;
                margin-bottom: 10px;
            }
            
            .countdown-display {
                font-size: 60px;
                min-height: 80px;
                margin: 5px 0;
            }
            
            .countdown-message {
                font-size: 20px;
                margin-bottom: 10px;
            }
            
            .start-countdown-btn {
                margin-top: 5px;
                padding: 12px 24px;
                font-size: 18px;
            }
        }
        
        /* Ensure photo doesn't exceed safe area */
        @media (max-height: 600px) {
            .camera-preview {
                width: 85%;
                max-width: 600px;
                height: 300px;
                margin-bottom: 10px;
            }
            
            .countdown-display {
                font-size: 50px;
                min-height: 50px;
                margin: 5px 0;
            }
            
            .countdown-message {
                font-size: 18px;
                margin-bottom: 8px;
            }
            
            .start-countdown-btn {
                margin-top: 5px;
                padding: 10px 20px;
                font-size: 16px;
            }
        }
        
        /* Very short screens */
        @media (max-height: 500px) {
            .camera-preview {
                height: 200px;
                margin-bottom: 5px;
            }
            
            .countdown-display {
                font-size: 40px;
                min-height: 40px;
                margin: 2px 0;
            }
            
            .countdown-message {
                font-size: 16px;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-container">
        <div class="countdown-message">Get ready for your photo!</div>
        
        <div class="camera-preview">
            <video id="cameraPreview" class="preview-video" autoplay muted playsinline style="display: none;"></video>
            <div id="previewPlaceholder" class="preview-placeholder">
                <div>📷</div>
                <div>Camera preview loading...</div>
                <div id="cameraStatus" style="font-size: 0.9em; margin-top: 10px; opacity: 0.8;"></div>
            </div>
            <div id="flashOverlay" class="flash-overlay"></div>
        </div>
        
        <div class="countdown-controls">
            <div id="countdownDisplay" class="countdown-display"></div>
            <button id="startCountdownBtn" class="start-countdown-btn">📸 Start Countdown</button>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <!-- Debug info - hidden by default on mobile -->
        <div id="debugInfo" class="debug-info" style="display: none;"></div>
    </div>
    
    <script>
        let countdownInterval;
        let mediaStream;
        let debugMode = window.innerWidth > 768; // Only show debug on larger screens
        
        function updateDebug(message) {
            if (debugMode) {
                const debugDiv = document.getElementById('debugInfo');
                debugDiv.style.display = 'block';
                debugDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
                // Keep only last 10 messages
                const lines = debugDiv.innerHTML.split('<br>');
                if (lines.length > 10) {
                    debugDiv.innerHTML = lines.slice(-10).join('<br>');
                }
                console.log('DEBUG:', message);
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            updateDebug('ERROR: ' + message);
            
            // Auto-hide error after 5 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Initialize camera preview
        async function initCameraPreview() {
            const video = document.getElementById('cameraPreview');
            const placeholder = document.getElementById('previewPlaceholder');
            const statusDiv = document.getElementById('cameraStatus');
            
            updateDebug('Attempting to initialize camera...');
            
            try {
                // Check if getUserMedia is supported
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported in this browser');
                }
                
                statusDiv.textContent = 'Requesting camera access...';
                updateDebug('Requesting camera permissions...');
                
                // Request camera access with mobile-friendly constraints
                const constraints = {
                    video: {
                        width: { ideal: 1280, min: 320 },
                        height: { ideal: 720, min: 240 },
                        facingMode: 'user' // Front camera on mobile
                    }
                };
                
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                updateDebug('Camera access granted');
                
                video.srcObject = mediaStream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
                
                updateDebug('Camera preview initialized successfully');
                
            } catch (error) {
                updateDebug('Camera error: ' + error.message);
                console.error('Error accessing camera:', error);
                
                let errorMessage = 'Camera preview not available';
                if (error.name === 'NotAllowedError') {
                    errorMessage = 'Camera access denied';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'No camera found';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage = 'Camera not supported';
                }
                
                statusDiv.innerHTML = `
                    <div style="font-size: 2em; margin-bottom: 10px;">📷</div>
                    <div>${errorMessage}</div>
                    <div style="font-size: 0.8em; margin-top: 10px; opacity: 0.7;">
                        Server camera will be used for photos
                    </div>
                `;
            }
        }
        
        // Start countdown sequence
        function startCountdown() {
            const countdownDisplay = document.getElementById('countdownDisplay');
            const startBtn = document.getElementById('startCountdownBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            updateDebug('Starting countdown...');
            
            startBtn.disabled = true;
            startBtn.textContent = 'Taking Photo...';
            errorDiv.style.display = 'none';
            
            let count = 3;
            countdownDisplay.textContent = count;
            
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                    updateDebug('Countdown: ' + count);
                } else {
                    countdownDisplay.textContent = 'SCOWL!';
                    updateDebug('Taking photo...');
                    clearInterval(countdownInterval);
                    
                    // Flash effect
                    setTimeout(() => {
                        document.getElementById('flashOverlay').classList.add('flash');
                        setTimeout(() => {
                            document.getElementById('flashOverlay').classList.remove('flash');
                            takePhoto();
                        }, 200);
                    }, 500);
                }
            }, 1000);
        }
        
        // Take photo and send to backend
        async function takePhoto() {
            updateDebug('Sending photo request to server...');
            
            try {
                const response = await fetch('/api/camera/start_countdown', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                updateDebug('Server response status: ' + response.status);
                
                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        updateDebug('Photo taken successfully, redirecting...');
                        
                        // Stop camera stream
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                            updateDebug('Camera stream stopped');
                        }
                        
                        // Small delay before redirect
                        setTimeout(() => {
                            window.location.href = '/camera/retake';
                        }, 500);
                    } else {
                        updateDebug('Server returned error: ' + result.message);
                        showError(result.message || 'Failed to take photo');
                        resetCountdown();
                    }
                } else {
                    const errorText = await response.text();
                    updateDebug('Server error: ' + errorText);
                    showError('Failed to take photo: ' + response.status);
                    resetCountdown();
                }
            } catch (error) {
                updateDebug('Network error: ' + error.message);
                showError('Network error: ' + error.message);
                resetCountdown();
            }
        }
        
        // Reset countdown state
        function resetCountdown() {
            const startBtn = document.getElementById('startCountdownBtn');
            const countdownDisplay = document.getElementById('countdownDisplay');
            
            startBtn.disabled = false;
            startBtn.textContent = 'Start Countdown';
            countdownDisplay.textContent = '';
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            updateDebug('Countdown reset');
        }
        
        // Event listeners
        document.getElementById('startCountdownBtn').addEventListener('click', startCountdown);
        
        // Initialize camera when page loads
        window.addEventListener('load', () => {
            updateDebug('Page loaded, initializing...');
            initCameraPreview();
        });
        
        // Clean up camera stream when leaving page
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                updateDebug('Cleaned up camera stream on page unload');
            }
        });
    </script>
</body>
</html>

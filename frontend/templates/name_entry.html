<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Booth - Enter Names</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Enter Names</h1>
        <p>Enter the names of people in the photo (at least one required):</p>
        
        <form id="nameForm" class="name-form">
            <div class="input-group">
                <label for="name1">Person 1:</label>
                <input type="text" id="name1" name="name1" placeholder="Enter name">
            </div>
            
            <div class="input-group">
                <label for="name2">Person 2:</label>
                <input type="text" id="name2" name="name2" placeholder="Enter name (optional)">
            </div>
            
            <div class="input-group">
                <label for="name3">Person 3:</label>
                <input type="text" id="name3" name="name3" placeholder="Enter name (optional)">
            </div>
            
            <div class="input-group">
                <label for="name4">Person 4:</label>
                <input type="text" id="name4" name="name4" placeholder="Enter name (optional)">
            </div>
            
            <div class="input-group">
                <label for="name5">Person 5:</label>
                <input type="text" id="name5" name="name5" placeholder="Enter name (optional)">
            </div>
            
            <button type="submit" class="action-button">Continue</button>
        </form>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Enter Names</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        .header {
            flex-shrink: 0;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .name-inputs {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        /* When keyboard is open, adjust the container */
        .container.keyboard-open {
            height: calc(100vh - 350px); /* Account for keyboard height */
        }
        
        .name-input {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            border: 3px solid #ddd;
            border-radius: 10px;
            text-align: center;
            background: white;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 1;
        }
        
        .name-input.active {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        
        /* Hide non-active inputs when keyboard is open */
        .container.keyboard-open .name-input:not(.active) {
            opacity: 0.3;
            transform: scale(0.9);
        }
        
        .submit-section {
            flex-shrink: 0;
            margin-top: 20px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* Custom Keyboard Styles */
        .custom-keyboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #f5f5f5;
            border-top: 2px solid #ddd;
            padding: 15px;
            z-index: 1000;
            display: none;
            height: 320px;
            box-sizing: border-box;
        }
        
        .keyboard-row {
            display: flex;
            justify-content: center;
            margin: 5px 0;
            gap: 5px;
        }
        
        .key {
            background: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 60px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }
        
        .key:active {
            background: #e0e0e0;
            transform: scale(0.95);
        }
        
        .key.special {
            background: #e8e8e8;
            color: #666;
        }
        
        .key.wide {
            flex: 2;
            min-width: 100px;
        }
        
        @media (max-width: 480px) {
            .key {
                min-width: 35px;
                height: 50px;
                padding: 10px;
                font-size: 16px;
            }
            
            .custom-keyboard {
                height: 280px;
            }
            
            .container.keyboard-open {
                height: calc(100vh - 300px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Enter Your Names</h1>
        </div>
        
        <div class="name-inputs">
            <input 
                type="text" 
                id="firstName"
                class="name-input" 
                placeholder="Tap to enter first name"
                readonly
                maxlength="30"
            >
            <input 
                type="text" 
                id="secondName"
                class="name-input" 
                placeholder="Tap to enter second name (optional)"
                readonly
                maxlength="30"
            >
        </div>
        
        <div class="submit-section">
            <button id="submitBtn" class="submit-btn" disabled>Continue to Selections</button>
        </div>
    </div>
    
    <!-- Custom Keyboard -->
    <div id="customKeyboard" class="custom-keyboard">
        <div class="keyboard-row">
            <button type="button" class="key" data-key="Q">Q</button>
            <button type="button" class="key" data-key="W">W</button>
            <button type="button" class="key" data-key="E">E</button>
            <button type="button" class="key" data-key="R">R</button>
            <button type="button" class="key" data-key="T">T</button>
            <button type="button" class="key" data-key="Y">Y</button>
            <button type="button" class="key" data-key="U">U</button>
            <button type="button" class="key" data-key="I">I</button>
            <button type="button" class="key" data-key="O">O</button>
            <button type="button" class="key" data-key="P">P</button>
        </div>
        <div class="keyboard-row">
            <button type="button" class="key" data-key="A">A</button>
            <button type="button" class="key" data-key="S">S</button>
            <button type="button" class="key" data-key="D">D</button>
            <button type="button" class="key" data-key="F">F</button>
            <button type="button" class="key" data-key="G">G</button>
            <button type="button" class="key" data-key="H">H</button>
            <button type="button" class="key" data-key="J">J</button>
            <button type="button" class="key" data-key="K">K</button>
            <button type="button" class="key" data-key="L">L</button>
        </div>
        <div class="keyboard-row">
            <button type="button" class="key special" data-key="shift">⇧</button>
            <button type="button" class="key" data-key="Z">Z</button>
            <button type="button" class="key" data-key="X">X</button>
            <button type="button" class="key" data-key="C">C</button>
            <button type="button" class="key" data-key="V">V</button>
            <button type="button" class="key" data-key="B">B</button>
            <button type="button" class="key" data-key="N">N</button>
            <button type="button" class="key" data-key="M">M</button>
            <button type="button" class="key special" data-key="backspace">⌫</button>
        </div>
        <div class="keyboard-row">
            <button type="button" class="key special wide" data-key=" ">Space</button>
            <button type="button" class="key special" data-key="clear">Clear</button>
            <button type="button" class="key special" data-key="done">Done</button>
        </div>
    </div>
    
    <script>
        let activeInput = null;
        let isShiftPressed = false;
        
        // Handle input clicks
        document.querySelectorAll('.name-input').forEach(input => {
            input.addEventListener('click', function() {
                // Remove active class from all inputs
                document.querySelectorAll('.name-input').forEach(inp => {
                    inp.classList.remove('active');
                });
                
                // Add active class to clicked input
                this.classList.add('active');
                activeInput = this;
                
                // Show keyboard and adjust container
                document.getElementById('customKeyboard').style.display = 'block';
                document.querySelector('.container').classList.add('keyboard-open');
            });
        });
        
        // Handle keyboard keys
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function() {
                if (!activeInput) return;
                
                const keyValue = this.dataset.key;
                
                switch(keyValue) {
                    case 'backspace':
                        activeInput.value = activeInput.value.slice(0, -1);
                        break;
                        
                    case 'clear':
                        activeInput.value = '';
                        break;
                        
                    case 'shift':
                        isShiftPressed = !isShiftPressed;
                        this.style.background = isShiftPressed ? '#4CAF50' : '#e8e8e8';
                        this.style.color = isShiftPressed ? 'white' : '#666';
                        updateKeyboardCase();
                        return;
                        
                    case 'done':
                        closeKeyboard();
                        break;
                        
                    case ' ':
                        activeInput.value += ' ';
                        break;
                        
                    default:
                        let char = keyValue;
                        if (!isShiftPressed) {
                            char = char.toLowerCase();
                        }
                        activeInput.value += char;
                        
                        if (isShiftPressed && keyValue.match(/[A-Z]/)) {
                            isShiftPressed = false;
                            document.querySelector('[data-key="shift"]').style.background = '#e8e8e8';
                            document.querySelector('[data-key="shift"]').style.color = '#666';
                            updateKeyboardCase();
                        }
                        break;
                }
                
                updateSubmitButton();
            });
        });
        
        function closeKeyboard() {
            document.getElementById('customKeyboard').style.display = 'none';
            document.querySelector('.container').classList.remove('keyboard-open');
            if (activeInput) {
                activeInput.classList.remove('active');
                activeInput = null;
            }
        }
        
        function updateKeyboardCase() {
            document.querySelectorAll('.key').forEach(key => {
                const keyValue = key.dataset.key;
                if (keyValue && keyValue.match(/[A-Z]/)) {
                    key.textContent = isShiftPressed ? keyValue : keyValue.toLowerCase();
                }
            });
        }
        
        function updateSubmitButton() {
            const firstName = document.getElementById('firstName').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (firstName.length > 0) {
                submitBtn.disabled = false;
                submitBtn.style.background = '#4CAF50';
            } else {
                submitBtn.disabled = true;
                submitBtn.style.background = '#ccc';
            }
        }
        
        // Handle submit
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const firstName = document.getElementById('firstName').value.trim();
            const secondName = document.getElementById('secondName').value.trim();
            
            if (!firstName) return;
            
            this.disabled = true;
            this.textContent = 'Submitting...';
            
            const names = [firstName];
            if (secondName) {
                names.push(secondName);
            }
            
            try {
                const response = await fetch('/api/session/submit_names', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ names: names })
                });
                
                if (response.ok) {
                    // Changed from /camera/countdown to /select/weapon
                    window.location.href = '/select/weapon';
                } else {
                    throw new Error('Failed to submit names');
                }
            } catch (error) {
                console.error('Error:', error);
                this.disabled = false;
                this.textContent = 'Continue to Selections';
                alert('Error submitting names. Please try again.');
            }
        });
        
        // Close keyboard when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-keyboard') && !e.target.closest('.name-input')) {
                closeKeyboard();
            }
        });
        
        // Initialize
        updateSubmitButton();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Weapon</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Choose Your Weapon</h1>
        <div class="choice-grid">
            <!-- These buttons need the 'choice-button' class and data-id attribute -->
            <button class="choice-button" data-id="weapon1" data-next-page="/select/land">Weapon 1</button>
            <button class="choice-button" data-id="weapon2" data-next-page="/select/land">Weapon 2</button>
            <button class="choice-button" data-id="weapon3" data-next-page="/select/land">Weapon 3</button>
            <button class="choice-button" data-id="weapon4" data-next-page="/select/land">Weapon 4</button>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>

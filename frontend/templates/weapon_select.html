<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Weapon</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Add preload hints -->
    <link rel="preload" href="/static/images/weapon1.jpg" as="image">
    <link rel="preload" href="/static/images/weapon2.jpg" as="image">
    <link rel="preload" href="/static/images/weapon3.jpg" as="image">
    <link rel="preload" href="/static/images/weapon4.jpg" as="image">
    <style>
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .choice-button {
            aspect-ratio: 1;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .choice-button:hover {
            background: #e3f2fd;
            border-color: #2196F3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        .choice-button:active {
            transform: translateY(0);
        }
        
        .choice-image {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            /* Add this for faster loading */
            image-rendering: auto;
            image-rendering: crisp-edges;
        }
        
        .choice-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        
        .choice-button.loading .choice-image {
            opacity: 0.5;
        }
        
        .choice-button.loading::after {
            content: "Loading...";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        @media (hover: none) {
            .choice-button:hover {
                transform: none;
                box-shadow: none;
            }
        }
        
        @media (max-width: 480px) {
            .choice-grid {
                gap: 15px;
                padding: 15px;
            }
            
            .choice-button {
                min-height: 100px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Weapon</h1>
        <div class="choice-grid">
            <button class="choice-button" data-id="weapon1" data-next-page="/select/land">
                <img src="/static/images/weapon1.jpg" alt="Weapon 1" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 1</div>
            </button>
            <button class="choice-button" data-id="weapon2" data-next-page="/select/land">
                <img src="/static/images/weapon2.jpg" alt="Weapon 2" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 2</div>
            </button>
            <button class="choice-button" data-id="weapon3" data-next-page="/select/land">
                <img src="/static/images/weapon3.jpg" alt="Weapon 3" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 3</div>
            </button>
            <button class="choice-button" data-id="weapon4" data-next-page="/select/land">
                <img src="/static/images/weapon4.jpg" alt="Weapon 4" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 4</div>
            </button>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        // Hide keyboard on any touch/click outside text inputs
        async function hideKeyboard() {
            try {
                await fetch('/api/keyboard/hide', { method: 'POST' });
            } catch (err) {
                console.log('Keyboard hide failed:', err);
            }
        }
        
        document.addEventListener('click', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Weapon</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Add preload hints -->
    <link rel="preload" href="/static/images/weapon1.jpg" as="image">
    <link rel="preload" href="/static/images/weapon2.jpg" as="image">
    <link rel="preload" href="/static/images/weapon3.jpg" as="image">
    <link rel="preload" href="/static/images/weapon4.jpg" as="image">
    <style>
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .choice-button {
            aspect-ratio: 1;
            border: 3px solid #333;
            border-radius: 10px;
            background: #f5f5f5;
            cursor: pointer;
            /* Remove expensive transitions */
            transition: transform 0.1s ease; /* Much faster */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .choice-button:hover {
            border-color: #4CAF50;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .choice-button:active {
            transform: scale(0.95); /* Immediate feedback */
        }
        
        .choice-image {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            /* Add this for faster loading */
            image-rendering: auto;
            image-rendering: crisp-edges;
        }
        
        .choice-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        
        .choice-button.loading .choice-image {
            opacity: 0.5;
        }
        
        .choice-button.loading::after {
            content: "Loading...";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        @media (hover: none) {
            .choice-button:hover {
                transform: none;
                box-shadow: none;
            }
        }
        
        @media (max-width: 768px) {
            .choice-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 15px;
            }
            
            .choice-button {
                min-height: 150px;
            }
            
            .choice-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Weapon</h1>
        <div class="choice-grid">
            <button class="choice-button" data-id="weapon1" data-next-page="/select/land">
                <img src="/static/images/weapon1.jpg" alt="Weapon 1" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 1</div>
            </button>
            <button class="choice-button" data-id="weapon2" data-next-page="/select/land">
                <img src="/static/images/weapon2.jpg" alt="Weapon 2" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 2</div>
            </button>
            <button class="choice-button" data-id="weapon3" data-next-page="/select/land">
                <img src="/static/images/weapon3.jpg" alt="Weapon 3" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 3</div>
            </button>
            <button class="choice-button" data-id="weapon4" data-next-page="/select/land">
                <img src="/static/images/weapon4.jpg" alt="Weapon 4" class="choice-image" loading="lazy">
                <div class="choice-label">Weapon 4</div>
            </button>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        // Hide keyboard on any touch/click outside text inputs
        async function hideKeyboard() {
            try {
                await fetch('/api/keyboard/hide', { method: 'POST' });
            } catch (err) {
                console.log('Keyboard hide failed:', err);
            }
        }
        
        document.addEventListener('click', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Booth - Start</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Photo Booth</h1>
        <button id="startButton" class="action-button">Start</button>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        // Update the start button to go to names first
        document.getElementById('startButton').addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = 'Starting...';
            
            try {
                const response = await fetch('/api/session/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    // Redirect to names entry instead of weapon selection
                    window.location.href = '/entry/names';
                } else {
                    throw new Error('Failed to start session');
                }
            } catch (error) {
                console.error('Error:', error);
                this.disabled = false;
                this.textContent = 'Start';
                alert('Error starting session. Please try again.');
            }
        });
        
        // Hide keyboard on any touch/click outside text inputs
        async function hideKeyboard() {
            try {
                await fetch('/api/keyboard/hide', { method: 'POST' });
            } catch (err) {
                console.log('Keyboard hide failed:', err);
            }
        }
        
        document.addEventListener('click', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Booth - Start</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Photo Booth</h1>
        <button id="startButton" class="action-button">Start</button>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        // Hide keyboard on any touch/click outside text inputs
        async function hideKeyboard() {
            try {
                await fetch('/api/keyboard/hide', { method: 'POST' });
            } catch (err) {
                console.log('Keyboard hide failed:', err);
            }
        }
        
        document.addEventListener('click', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.matches('input[type="email"], input[type="text"], textarea')) {
                hideKeyboard();
            }
        });
    </script>
</body>
</html>

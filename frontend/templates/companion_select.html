<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Companion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .choice-button {
            aspect-ratio: 1;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .choice-button:hover {
            background: #fff3e0;
            border-color: #FF9800;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }
        
        .choice-button:active {
            transform: translateY(0);
        }
        
        .choice-image {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .choice-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        
        .choice-button.loading .choice-image {
            opacity: 0.5;
        }
        
        .choice-button.loading::after {
            content: "Loading...";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .choice-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 15px;
            }
            
            .choice-button {
                min-height: 150px;
            }
            
            .choice-label {
                font-size: 14px;
            }
        }
        
        /* Mobile responsive */
        @media (max-width: 480px) {
            .choice-grid {
                gap: 15px;
                padding: 15px;
            }
            
            .choice-button {
                min-height: 100px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Companion</h1>
        <div class="choice-grid">
            <button class="choice-button" data-id="companion1" data-next-page="/camera/countdown">
                <img src="/static/images/companion1.jpg" alt="Companion 1" class="choice-image" loading="lazy">
                <div class="choice-label">Companion 1</div>
            </button>
            <button class="choice-button" data-id="companion2" data-next-page="/camera/countdown">
                <img src="/static/images/companion2.jpg" alt="Companion 2" class="choice-image" loading="lazy">
                <div class="choice-label">Companion 2</div>
            </button>
            <button class="choice-button" data-id="companion3" data-next-page="/camera/countdown">
                <img src="/static/images/companion3.jpg" alt="Companion 3" class="choice-image" loading="lazy">
                <div class="choice-label">Companion 3</div>
            </button>
            <button class="choice-button" data-id="companion4" data-next-page="/camera/countdown">
                <img src="/static/images/companion4.jpg" alt="Companion 4" class="choice-image" loading="lazy">
                <div class="choice-label">Companion 4</div>
            </button>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
